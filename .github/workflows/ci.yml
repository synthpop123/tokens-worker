name: CI

# Pushing to main deploys (Cloudflare Workers Builds), so this runs the
# same gate as the Workers Builds build command — `npm run check`: type
# generation + typecheck (src and tests) + the vitest suite. A red run
# here means the deploy that Workers Builds is doing in parallel was a
# regression; branch pushes get the verdict before merging.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to commit SHAs (Dependabot bumps
      # them); mutable tags could be repointed at malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
